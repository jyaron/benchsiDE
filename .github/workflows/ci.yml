name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build offline bundle and guide
        run: |
          python3 scripts/build_offline.py
          python3 scripts/build_guide.py
      - name: Install Playwright
        run: |
          npm install
          npx playwright install --with-deps
      - name: Run tests (Chromium, Firefox, WebKit)
        run: npx playwright test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload build outputs
        uses: actions/upload-artifact@v7
        with:
          name: benchside-dist
          path: dist/

  engine:
    # Test engine on public GEO data (tests/engine/README.md). Uses the JavaScriptCore shell built into macOS.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: python3 -m pip install numpy pandas scipy
      - name: Cache GEO data
        uses: actions/cache@v6
        with:
          path: tests/engine/data
          key: geo-${{ hashFiles('tests/engine/datasets.json') }}
      - name: Download and verify GEO data
        run: python3 tests/engine/fetch_data.py
      - name: Run engine checks
        run: python3 tests/engine/run_checks.py
