name: Deploy site
# Publishes https://www.benchside.org from main: the application at /, the guide at
# /guide.html and the offline build at /benchside-offline.html.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build offline bundle and guide
        run: |
          python3 scripts/build_offline.py
          python3 scripts/build_guide.py
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp dist/benchside-guide.html _site/guide.html
          cp dist/benchside-offline.html _site/benchside-offline.html
          echo "www.benchside.org" > _site/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
