name: Release
# Pushing a tag such as v0.19.2-beta builds the release files and creates a GitHub release
# with the application, the offline build and the guide attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build offline bundle and guide
        run: |
          python3 scripts/build_offline.py
          python3 scripts/build_guide.py
      - name: Test before release
        run: |
          npm install
          npx playwright install --with-deps
          npx playwright test
      - name: Check that the tag matches the application version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "const APP_VERSION=\"${TAG} " index.html || { echo "APP_VERSION in index.html does not match tag ${TAG}"; exit 1; }
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: benchsiDE ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          generate_release_notes: true
          files: |
            index.html
            dist/benchside-offline.html
            dist/benchside-guide.html
